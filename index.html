<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>FlightScope — Live Flight Tracker & Radar Map</title>
    <meta
      name="description"
      content="Track flights in real time with FlightScope. See live flight positions, routes, and status on an interactive radar map — free, fast, and no signup required."
    />
    <meta
      name="keywords"
      content="flight tracker, live flight tracker, flight radar, track flights, real-time flight tracking, flight status, airplane tracker"
    />
    <meta name="author" content="FlightScope" />
    <link rel="canonical" href="https://flight-scope-nu.vercel.app/" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlightScope" />
    <meta
      property="og:title"
      content="FlightScope — Live Flight Tracker & Radar Map"
    />
    <meta
      property="og:description"
      content="Track flights in real time with FlightScope. See live flight positions, routes, and status on an interactive radar map."
    />
    <meta property="og:url" content="https://flight-scope-nu.vercel.app/" />
    <meta
      property="og:image"
      content="https://flight-scope-nu.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="FlightScope — Live Flight Tracker & Radar Map"
    />
    <meta
      name="twitter:description"
      content="Track flights in real time with FlightScope. See live flight positions, routes, and status on an interactive radar map."
    />
    <meta
      name="twitter:image"
      content="https://flight-scope-nu.vercel.app/og-image.png"
    />

    <!-- Theme / PWA-ish niceties -->
    <meta name="theme-color" content="#0a1f2e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured data for rich results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "FlightScope",
        "url": "https://flight-scope-nu.vercel.app/",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Any",
        "description": "Track flights in real time with FlightScope. See live flight positions, routes, and status on an interactive radar map.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
